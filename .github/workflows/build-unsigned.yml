name: Build Unsigned (test only)

# 仅用于验证三端能否编译、打包、上传产物。
# - 不读取任何签名 Secrets
# - 不创建 GitHub Release
# - 产物未签名 / 未公证，禁止对外分发
#
# 正式发布请使用 .github/workflows/release.yml。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号（只影响产物文件名，不会发布）"
        required: false
        default: "0.1.0-test"
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 未签名构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            artifact: harbor-unsigned-macos
            target: universal-apple-darwin
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: harbor-unsigned-linux
            target: ""
          - name: Windows x86_64
            os: windows-latest
            artifact: harbor-unsigned-windows
            target: ""

    env:
      UNSIGNED_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 同步测试版本
        shell: bash
        run: |
          VERSION="${UNSIGNED_VERSION:-0.1.0-test}"
          node scripts/set-version.mjs "$VERSION"
          echo "本次测试版本：$VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: 安装 macOS 双架构 target
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libfuse2 rpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 macOS（未签名）
        if: runner.os == 'macOS'
        run: pnpm tauri build --target universal-apple-darwin

      - name: 构建 Linux（未签名）
        if: runner.os == 'Linux'
        run: pnpm tauri build

      - name: 构建 Windows（未签名）
        if: runner.os == 'Windows'
        run: pnpm tauri build

      - name: 标注未签名（Job Summary）
        shell: bash
        run: |
          VERSION="${UNSIGNED_VERSION:-0.1.0-test}"
          {
            echo "## ⚠️ 未签名测试构建"
            echo ""
            echo "- 版本：\`${VERSION}\`"
            echo "- 平台：${RUNNER_OS}"
            echo "- 产物未使用发布证书签名、未公证，**不能对外分发**。"
            echo "- 正式发布请运行 \`Release\` workflow，并配置签名 Secrets。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传未签名产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
