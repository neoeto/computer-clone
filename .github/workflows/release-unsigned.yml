name: Release Unsigned (no signing required)

# 完全不读取签名证书 / Secrets 的发布流程。
#
# 用途：在还没有 Apple / Windows / GPG 签名材料时，先编译三端安装包并创建 GitHub Release。
#
# 重要：
#   - 产物未使用发布证书签名、未公证；
#   - macOS 可能被 Gatekeeper 拦截，Windows 会触发 SmartScreen；
#   - Linux 包没有 GPG 签名；
#   - Release 名称带 (Unsigned)，且不会覆盖 Latest；
#   - 仅用于内部测试，不要作为正式版本对外分发。
#
# 正式签名发布仍使用 .github/workflows/release.yml。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v），例如 0.2.0"
        required: true
        type: string
      draft:
        description: "创建为草稿 Release（建议先草稿检查产物）"
        required: false
        default: true
        type: boolean
  push:
    tags: ["unsigned-v*"]

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: 解析版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 解析并校验版本
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME#unsigned-v}"
          else
            RAW="${INPUT_VERSION#v}"
          fi
          if ! [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号不合法：${RAW:-<empty>}；手动触发请填写类似 0.2.0 的版本"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "未签名发布版本：$RAW"

  build:
    name: 构建未签名 ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            artifact: harbor-unsigned-macos
            target: universal-apple-darwin
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: harbor-unsigned-linux
            target: ""
          - name: Windows x86_64
            os: windows-latest
            artifact: harbor-unsigned-windows
            target: ""

    env:
      VERSION: ${{ needs.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 同步发布版本
        shell: bash
        run: node scripts/set-version.mjs "$VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: 安装 macOS 双架构 target
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libfuse2 rpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 不导入任何证书，不设置 APPLE_SIGNING_IDENTITY / 证书 thumbprint。
      - name: 构建 macOS（未签名）
        if: runner.os == 'macOS'
        run: pnpm tauri build --target universal-apple-darwin

      - name: 构建 Linux（未签名）
        if: runner.os == 'Linux'
        run: pnpm tauri build

      - name: 构建 Windows（未签名）
        if: runner.os == 'Windows'
        run: pnpm tauri build

      - name: 标注未签名（Job Summary）
        shell: bash
        run: |
          {
            echo "## ⚠️ 未签名构建"
            echo ""
            echo "- 版本：\`${VERSION}\`"
            echo "- 平台：${RUNNER_OS}"
            echo "- 未使用发布证书签名、未公证，**不可对外分发**。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传未签名产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage

  release:
    name: 创建未签名 Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: harbor-unsigned-*
          path: artifacts
          merge-multiple: true

      - name: 确认三平台产物齐全
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find artifacts -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name '*.msi' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name '*.AppImage' -print -quit)"

      - name: 写入未签名说明并生成校验和
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cat > artifacts/UNSIGNED-WARNING.txt <<EOF
          Harbor v${VERSION} — UNSIGNED BUILD

          这是未签名测试版本，不是正式发布：
          - macOS 未使用 Developer ID 签名，也未公证，Gatekeeper 可能阻止打开；
          - Windows 未做 Authenticode 签名，SmartScreen 会提示未知发布者；
          - Linux 安装包没有 GPG 签名。

          SHA256SUMS 只用于校验文件完整性，不证明发布者身份。
          macOS:  shasum -a 256 -c SHA256SUMS
          Linux:  sha256sum -c SHA256SUMS

          请不要把这个 Release 当作正式版本分发。
          EOF

          cd artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\n' | sort > /tmp/harbor-assets.txt
          : > SHA256SUMS
          while IFS= read -r file; do
            sha256sum "$file" >> SHA256SUMS
          done < /tmp/harbor-assets.txt
          sha256sum -c SHA256SUMS

      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unsigned-v${{ needs.meta.outputs.version }}
          name: Harbor v${{ needs.meta.outputs.version }} (Unsigned)
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            > ⚠️ **这是未签名构建，不是正式发布版本。**
            >
            > macOS 未使用 Developer ID 签名 / 未公证，Windows 未做 Authenticode 签名，
            > Linux 包没有 GPG 签名。仅用于内部测试，请勿对外分发。

            ## 安装包

            - macOS universal：`.dmg`
            - Windows x86_64：`.msi` / NSIS `.exe`
            - Linux x86_64：`.deb` / `.rpm` / `.AppImage`

            ## 校验完整性

            ```bash
            # macOS
            shasum -a 256 -c SHA256SUMS
            # Linux
            sha256sum -c SHA256SUMS
            ```

            `SHA256SUMS` 只能证明文件没有损坏，不能证明发布者身份。

            正式版本请使用带签名的 `Release` workflow。
          files: |
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/SHA256SUMS
            artifacts/UNSIGNED-WARNING.txt
